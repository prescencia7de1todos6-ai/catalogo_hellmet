<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HELLMET — Producto</title>
<meta name="view-transition" content="same-origin">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../../Assets/Css/variables.css">
<link rel="stylesheet" href="../../Assets/Css/public.css">
<link rel="stylesheet" href="../../Assets/Css/producto.css">
</head>
<body>

<div id="header-container"></div>

<main id="producto-contenido" style="display:none;">
  <div class="product-detail-grid">
    <div class="product-carousel" id="carousel">
      <div class="carousel-track" id="carousel-track"></div>
      <div class="carousel-dots" id="carousel-dots"></div>
    </div>

    <div class="product-lightbox" id="product-lightbox">
      <button class="lightbox-cerrar" id="lightbox-cerrar" aria-label="Cerrar">✕</button>
      <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Anterior">‹</button>
      <div class="lightbox-imagen-wrap">
        <img id="lightbox-img" src="" alt="">
      </div>
      <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Siguiente">›</button>
      <span class="lightbox-hint">Toca la imagen para hacer zoom · rueda del mouse o pellizca para ajustar</span>
    </div>

    <div class="product-detail-info">
      <span class="eyebrow" id="detail-eyebrow"></span>
      <h1 id="detail-name"></h1>

      <div class="detail-block" id="detail-dimensions-block" style="display:none;">
        <h3>Medidas</h3>
        <ul id="detail-dimensions"></ul>
      </div>

      <div class="detail-block">
        <h3>Características</h3>
        <ul id="detail-features"></ul>
      </div>

      <div class="detail-block">
        <h3>Precio</h3>
        <div class="price-plate" id="detail-price"></div>
      </div>

      <div class="share-bar">
        <span>Enlace</span>
        <input type="text" id="product-link" readonly>
        <button id="copy-link-btn">Copiar</button>
      </div>
      <p class="copy-feedback" id="copy-feedback"></p>
    </div>
  </div>
</main>

<div id="producto-vacio" class="category-empty-state" style="display:none;">
  Este producto no está disponible.
  <br><a href="../Categorias/" style="color:var(--accent);">Volver al catálogo</a>
</div>

<div id="footer-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../Services/Supabase.js"></script>
<script src="../../Utils/mensajes.js"></script>
<script src="../../Services/Productos.js"></script>
<script src="../../Services/Sucursal_redes.js"></script>
<script src="../../Componentes/Header.js"></script>
<script src="../../Componentes/Footer.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    renderHeader("../../Assets", "../../index.html");
    renderFooter();
    inicializarLightbox();
    await cargarProducto();
  });

  function obtenerIdProductoDeUrl() {
    return new URLSearchParams(window.location.search).get("producto");
  }

  let imagenesProducto = [];
  let indiceActual = 0;

  async function cargarProducto() {
    const idProd = obtenerIdProductoDeUrl();
    if (!idProd) { mostrarVacio(); return; }

    const { data: producto, error } = await ProductosService.obtenerPublicoPorId(idProd);
    if (error || !producto) { mostrarVacio(); return; }

    document.title = `HELLMET — ${producto.nom_prod}`;
    document.getElementById("detail-eyebrow").textContent = producto.categoria ? producto.categoria.nom_cate : "";
    document.getElementById("detail-name").textContent = producto.nom_prod;

    const dimBlock = document.getElementById("detail-dimensions-block");
    const dims = [
      producto.alto ? `Alto: ${producto.alto} cm` : null,
      producto.ancho ? `Ancho: ${producto.ancho} cm` : null,
      producto.largo ? `Largo: ${producto.largo} cm` : null,
    ].filter(Boolean);
    if (dims.length > 0) {
      dimBlock.style.display = "";
      document.getElementById("detail-dimensions").innerHTML = dims.map((d) => `<li>${d}</li>`).join("");
    }

    // Generales primero, específicos debajo
    // Cada característica: "ELEMENTO: CUALIDAD" si tiene cualidad, si no solo "ELEMENTO"
    const caracteristicas = (producto.caracteristica || []).map((c) =>
      c.cualidad ? `${c.elemento}: ${c.cualidad}` : c.elemento
    );

    // Al final de la lista, una línea con los colores admitidos (desde el backend)
    const nombresColores = (producto.producto_color || []).map((pc) => pc.color.nom_color);
    if (nombresColores.length > 0) {
      caracteristicas.push(`COLORES: ${nombresColores.join(", ")}`);
    }

    document.getElementById("detail-features").innerHTML = caracteristicas.map((f) => `<li>${f}</li>`).join("")
      || `<li>Sin características registradas.</li>`;

    document.getElementById("detail-price").textContent = `Bs ${producto.precio}`;

    const linkInput = document.getElementById("product-link");
    linkInput.value = window.location.href;

    imagenesProducto = (producto.img_producto || [])
      .sort((a, b) => (a.orden || 0) - (b.orden || 0))
      .map((i) => i.url_img);
    renderCarrusel();

    document.getElementById("producto-contenido").style.display = "";
    document.getElementById("copy-link-btn").addEventListener("click", copiarEnlace);
  }

  function mostrarVacio() {
    document.getElementById("producto-vacio").style.display = "";
    mostrarMensaje(MENSAJES.PAGINA_INEXISTENTE, "error");
  }

  function renderCarrusel() {
    const track = document.getElementById("carousel-track");
    const dots = document.getElementById("carousel-dots");
    if (imagenesProducto.length === 0) {
      track.innerHTML = `<div class="carousel-slide"><span>Sin imágenes</span></div>`;
      return;
    }
    track.innerHTML = imagenesProducto.map((url) => `
      <div class="carousel-slide"><img src="${url}" alt="" draggable="false"></div>
    `).join("");
    dots.innerHTML = imagenesProducto.map((_, i) => `<span class="dot ${i === 0 ? "active" : ""}"></span>`).join("");

    let startX = 0;
    track.addEventListener("pointerdown", (e) => {
      startX = e.clientX;
      track.setPointerCapture(e.pointerId); // así el arrastre sigue funcionando aunque el mouse salga del carrusel
    });
    track.addEventListener("pointerup", (e) => {
      const delta = e.clientX - startX;
      if (delta > 40) moverCarrusel(-1);
      else if (delta < -40) moverCarrusel(1);
      else abrirLightbox(indiceActual); // si casi no se movió, fue un toque/click: abrir zoom
    });
  }

  /* =========================================================
     Zoom de imagen (lightbox) — solo en la página pública de
     producto, se abre al tocar/clickear la imagen del carrusel.
     ========================================================= */
  let indiceLightbox = 0;
  let zoomNivel = 1;
  const ZOOM_TOQUE = 2.2; // nivel al hacer click/tap simple
  const ZOOM_MAX = 4;
  let panX = 0, panY = 0;
  let arrastrandoZoom = false;
  let inicioArrastre = { x: 0, y: 0 };
  const pointersActivos = new Map(); // para el pellizco (pinch) con dos dedos
  let distanciaPinchInicial = 0;
  let zoomAlIniciarPinch = 1;

  function abrirLightbox(indice) {
    if (imagenesProducto.length === 0) return;
    indiceLightbox = indice;
    actualizarImagenLightbox();
    document.getElementById("product-lightbox").classList.add("abierto");
    document.body.style.overflow = "hidden";
  }

  function cerrarLightbox() {
    document.getElementById("product-lightbox").classList.remove("abierto");
    document.body.style.overflow = "";
  }

  function actualizarImagenLightbox() {
    document.getElementById("lightbox-img").src = imagenesProducto[indiceLightbox];
    resetZoom();
    const varias = imagenesProducto.length > 1;
    document.getElementById("lightbox-prev").style.display = varias ? "" : "none";
    document.getElementById("lightbox-next").style.display = varias ? "" : "none";
  }

  function navegarLightbox(direccion) {
    indiceLightbox = (indiceLightbox + direccion + imagenesProducto.length) % imagenesProducto.length;
    actualizarImagenLightbox();
  }

  function resetZoom() {
    zoomNivel = 1;
    panX = 0;
    panY = 0;
    aplicarTransformZoom();
    document.getElementById("lightbox-img").classList.remove("zoom-activo");
  }

  function aplicarTransformZoom() {
    const img = document.getElementById("lightbox-img");
    img.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomNivel})`;
    img.classList.toggle("zoom-activo", zoomNivel > 1);
  }

  function fijarZoom(nuevoNivel) {
    zoomNivel = Math.min(Math.max(nuevoNivel, 1), ZOOM_MAX);
    if (zoomNivel === 1) { panX = 0; panY = 0; }
    aplicarTransformZoom();
  }

  function inicializarLightbox() {
    const overlay = document.getElementById("product-lightbox");
    const img = document.getElementById("lightbox-img");

    document.getElementById("lightbox-cerrar").addEventListener("click", cerrarLightbox);
    document.getElementById("lightbox-prev").addEventListener("click", () => navegarLightbox(-1));
    document.getElementById("lightbox-next").addEventListener("click", () => navegarLightbox(1));

    // Clickear el fondo oscuro (fuera de la imagen y los botones) cierra el zoom.
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) cerrarLightbox();
    });

    document.addEventListener("keydown", (e) => {
      if (!overlay.classList.contains("abierto")) return;
      if (e.key === "Escape") cerrarLightbox();
      else if (e.key === "ArrowLeft") navegarLightbox(-1);
      else if (e.key === "ArrowRight") navegarLightbox(1);
    });

    // Click/tap simple sobre la imagen: alterna entre 1x y el zoom de toque.
    // Si hubo arrastre o pellizco, no se cuenta como "click".
    let huboArrastreOPinch = false;

    img.addEventListener("click", () => {
      if (huboArrastreOPinch) { huboArrastreOPinch = false; return; }
      fijarZoom(zoomNivel > 1 ? 1 : ZOOM_TOQUE);
    });

    // Rueda del mouse: zoom continuo, centrado en el cursor de forma aproximada.
    overlay.addEventListener("wheel", (e) => {
      e.preventDefault();
      const paso = e.deltaY < 0 ? 0.3 : -0.3;
      fijarZoom(zoomNivel + paso);
    }, { passive: false });

    // Arrastrar para mover la imagen cuando está ampliada, y pellizcar
    // con dos dedos para hacer zoom (pinch-to-zoom) en táctil.
    img.addEventListener("pointerdown", (e) => {
      pointersActivos.set(e.pointerId, { x: e.clientX, y: e.clientY });
      img.setPointerCapture(e.pointerId);

      if (pointersActivos.size === 2) {
        const [p1, p2] = [...pointersActivos.values()];
        distanciaPinchInicial = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        zoomAlIniciarPinch = zoomNivel;
        arrastrandoZoom = false;
      } else if (zoomNivel > 1) {
        arrastrandoZoom = true;
        img.classList.add("arrastrando");
        inicioArrastre = { x: e.clientX - panX, y: e.clientY - panY };
      }
    });

    img.addEventListener("pointermove", (e) => {
      if (!pointersActivos.has(e.pointerId)) return;
      pointersActivos.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointersActivos.size === 2) {
        huboArrastreOPinch = true;
        const [p1, p2] = [...pointersActivos.values()];
        const distanciaActual = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        if (distanciaPinchInicial > 0) {
          fijarZoom(zoomAlIniciarPinch * (distanciaActual / distanciaPinchInicial));
        }
      } else if (arrastrandoZoom) {
        huboArrastreOPinch = true;
        panX = e.clientX - inicioArrastre.x;
        panY = e.clientY - inicioArrastre.y;
        aplicarTransformZoom();
      }
    });

    const soltarPuntero = (e) => {
      pointersActivos.delete(e.pointerId);
      arrastrandoZoom = false;
      img.classList.remove("arrastrando");
      if (pointersActivos.size < 2) distanciaPinchInicial = 0;
    };
    img.addEventListener("pointerup", soltarPuntero);
    img.addEventListener("pointercancel", soltarPuntero);
    img.addEventListener("pointerleave", soltarPuntero);
  }

  function moverCarrusel(direccion) {
    if (imagenesProducto.length === 0) return;
    indiceActual = (indiceActual + direccion + imagenesProducto.length) % imagenesProducto.length;
    const track = document.getElementById("carousel-track");
    track.style.transform = `translateX(-${indiceActual * 100}%)`;
    document.querySelectorAll(".carousel-dots .dot").forEach((d, i) => d.classList.toggle("active", i === indiceActual));
  }

  function copiarEnlace() {
    const input = document.getElementById("product-link");
    input.select();
    navigator.clipboard.writeText(input.value).then(() => {
      document.getElementById("copy-feedback").textContent = "¡Enlace copiado!";
      setTimeout(() => { document.getElementById("copy-feedback").textContent = ""; }, 2000);
    }).catch(() => {
      document.execCommand("copy");
    });
  }
</script>
</body>
</html>
